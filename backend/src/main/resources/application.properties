server.port=8080

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/naboplan}
spring.datasource.username=${DATABASE_USERNAME:naboplan}
spring.datasource.password=${DATABASE_PASSWORD:naboplan}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Anthropic Claude API
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-opus-4-5

# App config
app.base.url=${APP_BASE_URL:http://localhost:3000}
sendgrid.api.key=${SENDGRID_API_KEY:}

# Async config
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
